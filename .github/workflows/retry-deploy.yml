# Auto-retry for "Deploy to Hostinger" failures.
#
# Why: the FTP control-socket connection to Hostinger intermittently never
# completes (4 failures in the month before 2026-08-10, all
# "Error: Timeout (control socket)"). Raising the per-operation timeout to
# 120s (see deploy.yml) didn't eliminate it because the handshake isn't slow,
# it's dead - only a fresh connection attempt helps. Every failure so far
# succeeded untouched on the next day's cron, so a same-day retry should
# almost always recover.
#
# How: workflow_run fires when a deploy run completes; if it failed and this
# is still an early attempt, re-run only the failed jobs. Each rerun completes
# and fires this workflow again with run_attempt incremented, so the guard
# below allows at most 2 retries (attempts 1 and 2 trigger a rerun; a failure
# on attempt 3 stays failed and notifies as usual). The FTP sync is
# idempotent, so re-running a partially-deployed job is safe.

name: Retry failed deploy

on:
  workflow_run:
    workflows: ['Deploy to Hostinger']
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          echo "Deploy run $RUN_ID failed on attempt $ATTEMPT; re-running failed jobs."
          gh run rerun "$RUN_ID" --failed --repo "$REPO"
