# Lighthouse budgets: audits a representative set of pages on every PR and
# hard-fails if performance, accessibility, best-practices, or SEO regress
# below threshold. Two runs: mobile (lighthouserc.cjs, the primary gate -
# Lighthouse default emulation = Moto-G-class + slow-4G) and desktop
# (lighthouserc.desktop.cjs). Runs on pull_request ONLY so it never gates the
# direct-to-main auto-deploy; intended as a required status check.
name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

# One run per ref; newer pushes cancel in-flight checks.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lighthouse CI (mobile)
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Lighthouse CI (desktop)
        run: npm run lhci:desktop
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
